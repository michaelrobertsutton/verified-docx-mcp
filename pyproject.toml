[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verified-docx-mcp"
version = "0.1.0"
description = "MCP server for local .docx files with verified writes (Word render backend)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Michael Sutton" }]
keywords = ["mcp", "model-context-protocol", "docx", "word", "llm", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # The major-version ceiling is deliberate: FastMCP 4 moves the protocol types
    # from `mcp.types` to a standalone `mcp_types` package, which breaks the
    # `import mcp.types` in middleware.py at startup. Copied with this comment
    # from GoogleDocs-MCP/pyproject.toml (issue #28 WP-02).
    "fastmcp>=3.0,<4",
    "markdown-it-py>=3.0",
    # Direct dependency, not just a fastmcp transitive: middleware.py imports
    # mcp.types for CallToolRequestParams.
    "mcp>=1.27,<2",
    # issue #106 WP-2: the WSS ops channel between the bridge
    # (live/bridge.py) and the Word task pane (addin/taskpane.js) --
    # request/reply op dispatch (search/replace/format/comments/save),
    # separate from the stdlib http.server used for the static HTTPS
    # pane + /ping + /report. Already present transitively via
    # uvicorn[standard]'s "server" extra (fastmcp -> uvicorn), but that
    # is an implementation detail of an unrelated dependency, not a
    # promise about which API this repo's own code may call -- hence a
    # direct pin. Floor >=15.0.1: fastmcp[server]>=3.0 itself requires
    # websockets>=15.0.1 (verified via `uv sync` resolution failure
    # against the plan's original `<15` ceiling), so this bridge is
    # written against the websockets>=15 `websockets.asyncio.server` API
    # (single-argument connection handler; the request path comes from
    # `connection.request.path`, not a second handler argument) rather
    # than the pre-15 legacy `(websocket, path)` signature. Ceiling <16
    # mirrors this repo's other major-version ceilings (fastmcp, mcp).
    "websockets>=15.0.1,<16",
]

[project.urls]
Homepage = "https://github.com/michaelrobertsutton/verified-docx-mcp"
Repository = "https://github.com/michaelrobertsutton/verified-docx-mcp"
Issues = "https://github.com/michaelrobertsutton/verified-docx-mcp/issues"

[dependency-groups]
# uv (PEP 735) installs the "dev" group by default on `uv sync` / `uv run`
# — unlike [project.optional-dependencies] extras, no `--extra dev` flag
# needed. This is what makes the gate command `uv run pytest tests/unit`
# work with no extra flags.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
]

[project.scripts]
verified-docx-mcp = "verified_docx_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/verified_docx_mcp"]

# Explicit allowlist, not a denylist: anything not named here stays out of
# the tarball, so a tool directory added tomorrow is excluded by default
# rather than shipped by accident (mirrors verified-googledocs-mcp).
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=verified_docx_mcp --cov-report=term-missing"
markers = [
    "live: live acceptance tests that need a real Word install and macOS Automation grant; skipped unless --run-live is passed. See tests/live/.",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
